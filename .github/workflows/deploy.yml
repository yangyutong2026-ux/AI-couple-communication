name: 部署到 GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build
        env:
          # 这两个值本来就会出现在网页源码里，公开是设计如此。
          # 真正的保护来自数据库那套 RLS 规则，不是靠藏这串 key。
          NEXT_PUBLIC_SUPABASE_URL: https://jwmybknehcvibgzcvmce.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_mgHe6QbDfbKFj_7fbpV6VQ_uFmMxjnt
          # 第三步接上 Claude 之后，这里填 Supabase Edge Function 的地址。
          NEXT_PUBLIC_AI_ENDPOINT: ${{ vars.AI_ENDPOINT }}

      # 不加这个文件，GitHub Pages 会忽略掉 _next 目录（下划线开头的都被当成模板文件）
      - run: touch out/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
