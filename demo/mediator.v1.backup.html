<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>之间 · 双人沟通调解器</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,340;9..144,460;9..144,600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#211D22;
    --ink-soft:#5B5560;
    --paper:#E7E3DA;
    --paper-raised:#F1EEE6;
    --deep:#181A20;
    --line:#CFC9BC;
    --a:#B5652E;
    --a-soft:#EFDCC8;
    --b:#2E6B70;
    --b-soft:#D6E6E5;
    --ai:#5A4E8F;
    --ai-soft:#E4E0F2;
    --warn:#9C4A3A;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Manrope',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .app{
    max-width:760px;
    margin:0 auto;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    background:var(--paper-raised);
    border-left:1px solid var(--line);
    border-right:1px solid var(--line);
  }
  header{
    background:var(--deep);
    color:var(--paper-raised);
    padding:22px 24px 18px;
  }
  header .title{
    font-family:'Fraunces',serif;
    font-size:26px;
    font-weight:460;
    letter-spacing:0.2px;
  }
  header .sub{
    font-size:13px;
    color:#B8B4C4;
    margin-top:4px;
    line-height:1.6;
  }
  .roleswitch{
    display:flex;
    align-items:center;
    gap:10px;
    margin-top:16px;
    font-size:13px;
  }
  .roleswitch span.label{color:#9490A0;}
  .roletoggle{
    display:flex;
    border-radius:999px;
    overflow:hidden;
    border:1px solid #3A3D46;
  }
  .roletoggle button{
    border:none;
    padding:6px 16px;
    font-family:'Manrope',sans-serif;
    font-size:13px;
    font-weight:600;
    cursor:pointer;
    background:transparent;
    color:#B8B4C4;
    transition:background .15s ease, color .15s ease;
  }
  .roletoggle button.active-a{background:var(--a);color:#fff;}
  .roletoggle button.active-b{background:var(--b);color:#fff;}

  nav.tabs{
    display:flex;
    border-bottom:1px solid var(--line);
    background:var(--paper-raised);
    position:sticky;
    top:0;
    z-index:5;
  }
  nav.tabs button{
    flex:1;
    padding:14px 8px;
    background:none;
    border:none;
    font-family:'Manrope',sans-serif;
    font-size:14px;
    font-weight:600;
    color:var(--ink-soft);
    cursor:pointer;
    border-bottom:2px solid transparent;
    transition:color .15s ease;
  }
  nav.tabs button.active{
    color:var(--ink);
    border-bottom:2px solid var(--ink);
  }

  main{
    flex:1;
    padding:20px 24px 100px;
    overflow-y:auto;
  }
  .panel-note{
    font-size:12.5px;
    color:var(--ink-soft);
    line-height:1.7;
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:10px;
    padding:12px 14px;
    margin-bottom:18px;
  }
  .panel-note b{color:var(--ink);}

  .diary-entry{
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:12px;
    padding:16px 18px;
    margin-bottom:14px;
  }
  .diary-entry .meta{
    font-size:11.5px;
    color:var(--ink-soft);
    margin-bottom:8px;
  }
  .diary-entry .text{
    font-family:'Fraunces',serif;
    font-size:16.5px;
    line-height:1.75;
    white-space:pre-wrap;
  }
  .diary-entry img{
    margin-top:10px;
    max-width:100%;
    border-radius:8px;
    display:block;
  }
  .composer{
    margin-top:20px;
    border-top:1px solid var(--line);
    padding-top:16px;
  }
  textarea{
    width:100%;
    resize:vertical;
    min-height:80px;
    font-family:'Manrope',sans-serif;
    font-size:14.5px;
    padding:12px 14px;
    border-radius:10px;
    border:1px solid var(--line);
    background:#fff;
    color:var(--ink);
  }
  .composer-row{
    display:flex;
    align-items:center;
    gap:10px;
    margin-top:10px;
  }
  .filebtn{
    font-size:12.5px;
    color:var(--ink-soft);
    cursor:pointer;
    border:1px dashed var(--line);
    padding:7px 12px;
    border-radius:8px;
  }
  .filebtn input{display:none;}
  .thumb-preview{
    max-height:44px;
    border-radius:6px;
  }
  .btn{
    border:none;
    border-radius:999px;
    padding:9px 20px;
    font-family:'Manrope',sans-serif;
    font-weight:600;
    font-size:13.5px;
    cursor:pointer;
    color:#fff;
  }
  .btn.a{background:var(--a);}
  .btn.b{background:var(--b);}
  .btn.ai{background:var(--ai);}
  .btn:disabled{opacity:.45;cursor:default;}
  .btn.ghost{
    background:transparent;
    border:1px solid var(--line);
    color:var(--ink-soft);
  }

  .bubble-row{display:flex;margin-bottom:12px;}
  .bubble-row.me{justify-content:flex-end;}
  .bubble{
    max-width:78%;
    padding:10px 14px;
    border-radius:14px;
    font-size:14.5px;
    line-height:1.6;
  }
  .bubble .who{
    font-size:11px;
    font-weight:700;
    margin-bottom:3px;
    opacity:.75;
  }
  .bubble.a-msg{background:var(--a-soft);border-bottom-left-radius:4px;}
  .bubble.b-msg{background:var(--b-soft);border-bottom-left-radius:4px;}
  .bubble-row.me .bubble{border-bottom-right-radius:4px;border-bottom-left-radius:14px;}

  .ai-msg-row{margin-bottom:16px;}
  .ai-msg-row.user .bubble{
    background:var(--paper);
    border:1px solid var(--line);
    margin-left:auto;
    border-bottom-right-radius:4px;
  }
  .ai-msg-row.assistant .bubble{
    background:var(--ai-soft);
    border-bottom-left-radius:4px;
  }
  .ai-msg-row .bubble{max-width:82%;padding:12px 15px;border-radius:14px;font-size:14.5px;line-height:1.7;}
  .ai-msg-row.user{display:flex;}
  .draft-box{
    margin-top:10px;
    background:#fff;
    border:1px solid var(--line);
    border-radius:10px;
    padding:12px 14px;
  }
  .draft-box .label{font-size:11.5px;color:var(--ink-soft);margin-bottom:6px;font-weight:600;}
  .draft-box .content{font-family:'Fraunces',serif;font-size:15px;line-height:1.6;}
  .draft-actions{display:flex;gap:8px;margin-top:10px;}
  .thinking{
    font-size:13px;
    color:var(--ink-soft);
    font-style:italic;
  }

  .confirm-mask{
    position:fixed;inset:0;background:rgba(24,26,32,.5);
    display:flex;align-items:center;justify-content:center;
    z-index:50;padding:20px;
  }
  .confirm-card{
    background:#fff;border-radius:14px;padding:22px;max-width:420px;width:100%;
  }
  .confirm-card h3{font-family:'Fraunces',serif;font-weight:500;font-size:19px;margin:0 0 10px;}
  .confirm-card p{font-size:13.5px;color:var(--ink-soft);line-height:1.6;margin-bottom:14px;}
  .confirm-card textarea{margin-bottom:14px;}
  .confirm-actions{display:flex;justify-content:flex-end;gap:10px;}

  ::placeholder{color:#A79F94;}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="title">之间</div>
    <div class="sub">一个帮双方把话说清楚的空间 — AI 只做理解与引导，不做评判</div>
    <div class="roleswitch">
      <span class="label">演示视角 · 当前登录为</span>
      <div class="roletoggle">
        <button id="toggleA" class="active-a">阿岚</button>
        <button id="toggleB">小时</button>
      </div>
    </div>
  </header>

  <nav class="tabs">
    <button data-tab="diary" class="active">日记本</button>
    <button data-tab="shared">共同沟通</button>
    <button data-tab="ai">与AI对话</button>
  </nav>

  <main id="main"></main>
</div>

<div id="modalRoot"></div>

<script>
const NAMES = { A: '阿岚', B: '小时' };
const COLOR_CLASS = { A: 'a', B: 'b' };

const state = {
  currentUser: 'A',
  activeTab: 'diary',
  diary: {
    A: [
      { text: '今天下班很累，看到家里没人收拾碗筷，心里有点堵。可能我没说出口，其实我不是嫌TA懒，是觉得自己回家像在上第二班。', img: null, ts: '昨天 22:14' }
    ],
    B: [
      { text: '阿岚今天说话语气有点冲，我当时其实很委屈——我下午改方案改到崩溃，根本没顾上碗筷。但我没解释，直接就沉默了，我知道我一沉默TA会更生气。', img: null, ts: '昨天 23:02' }
    ]
  },
  shared: [
    { sender: 'A', text: '你能不能至少把碗放进水槽里，我真的很累了还要收拾。', ts: '昨天 21:40' },
    { sender: 'B', text: '……', ts: '昨天 21:41' },
    { sender: 'A', text: '算了。', ts: '昨天 21:41' }
  ],
  aiThreads: { A: [], B: [] },
  pendingDraft: null
};

function escapeHtml(s){
  return (s||'').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

function partnerOf(u){ return u === 'A' ? 'B' : 'A'; }

function render(){
  document.getElementById('toggleA').className = state.currentUser === 'A' ? 'active-a' : '';
  document.getElementById('toggleB').className = state.currentUser === 'B' ? 'active-b' : '';
  document.querySelectorAll('nav.tabs button').forEach(b=>{
    b.classList.toggle('active', b.dataset.tab === state.activeTab);
  });
  const main = document.getElementById('main');
  if(state.activeTab === 'diary') main.innerHTML = renderDiary();
  else if(state.activeTab === 'shared') main.innerHTML = renderShared();
  else main.innerHTML = renderAI();
  attachHandlers();
}

function renderDiary(){
  const entries = state.diary[state.currentUser];
  const rows = entries.map(e => `
    <div class="diary-entry">
      <div class="meta">${e.ts}</div>
      <div class="text">${escapeHtml(e.text)}</div>
      ${e.img ? `<img src="${e.img}">` : ''}
    </div>
  `).join('');
  return `
    <div class="panel-note"><b>只有你自己能看到这里。</b> AI 会阅读你的日记来理解你的性格和情绪，但绝不会把内容告诉对方，也不会在这里回复你。</div>
    ${rows || '<div class="panel-note">还没有日记，写下今天的心情吧。</div>'}
    <div class="composer">
      <textarea id="diaryInput" placeholder="写点什么，只有你能看到……"></textarea>
      <div class="composer-row">
        <label class="filebtn">添加图片 <input type="file" id="diaryImg" accept="image/*"></label>
        <img id="diaryImgPreview" class="thumb-preview" style="display:none;">
        <div style="flex:1;"></div>
        <button class="btn ${COLOR_CLASS[state.currentUser]}" id="saveDiary">保存到日记</button>
      </div>
    </div>
  `;
}

function renderShared(){
  const rows = state.shared.map(m => `
    <div class="bubble-row ${m.sender === state.currentUser ? 'me' : ''}">
      <div class="bubble ${m.sender === 'A' ? 'a-msg' : 'b-msg'}">
        <div class="who">${NAMES[m.sender]}</div>
        ${escapeHtml(m.text)}
      </div>
    </div>
  `).join('');
  return `
    <div class="panel-note"><b>双方都能看到这里。</b> AI 会阅读这里的对话来理解矛盾发生的经过，但不会在这里插话。</div>
    ${rows}
    <div class="composer">
      <textarea id="sharedInput" placeholder="想直接对TA说的话，写在这里……"></textarea>
      <div class="composer-row">
        <div style="flex:1;"></div>
        <button class="btn ${COLOR_CLASS[state.currentUser]}" id="sendShared">发送给对方</button>
      </div>
    </div>
  `;
}

function renderAI(){
  const thread = state.aiThreads[state.currentUser];
  const rows = thread.map(m => {
    if(m.role === 'user'){
      return `<div class="ai-msg-row user"><div class="bubble">${escapeHtml(m.content)}</div></div>`;
    }
    const draft = m.draft ? `
      <div class="draft-box">
        <div class="label">AI 帮你起草的一句话 · 发送前你可以修改</div>
        <div class="content">${escapeHtml(m.draft)}</div>
        <div class="draft-actions">
          <button class="btn ${COLOR_CLASS[state.currentUser]}" data-send-draft="${escapeHtml(m.draft)}">确认后发送到共同沟通</button>
        </div>
      </div>` : '';
    return `<div class="ai-msg-row assistant"><div class="bubble">${escapeHtml(m.content)}</div>${draft}</div>`;
  }).join('');
  return `
    <div class="panel-note"><b>只有你和AI能看到这里。</b> AI 会结合你的日记、对方日记里体现出的性格与情绪状态，以及你们的共同沟通记录，给你建议 —— 但不会向你透露对方日记里的具体内容。任何要发给对方的话，都需要你确认后才会真正发出。</div>
    <div id="aiThread">${rows || '<div class="panel-note">可以先问问AI："TA今天为什么突然不说话了？"</div>'}</div>
    <div id="aiThinking" style="display:none;" class="panel-note thinking">AI 正在结合双方的情况思考……</div>
    <div class="composer">
      <textarea id="aiInput" placeholder="想问AI什么，或者想让TA帮你理清思路……"></textarea>
      <div class="composer-row">
        <div style="flex:1;"></div>
        <button class="btn ai" id="askAI">发送</button>
      </div>
    </div>
  `;
}

function attachHandlers(){
  const saveDiary = document.getElementById('saveDiary');
  if(saveDiary){
    let pendingImg = null;
    document.getElementById('diaryImg').addEventListener('change', (e)=>{
      const f = e.target.files[0];
      if(!f) return;
      const reader = new FileReader();
      reader.onload = () => {
        pendingImg = reader.result;
        const prev = document.getElementById('diaryImgPreview');
        prev.src = pendingImg;
        prev.style.display = 'inline-block';
      };
      reader.readAsDataURL(f);
    });
    saveDiary.addEventListener('click', ()=>{
      const val = document.getElementById('diaryInput').value.trim();
      if(!val && !pendingImg) return;
      state.diary[state.currentUser].push({ text: val, img: pendingImg, ts: '刚刚' });
      pendingImg = null;
      render();
    });
  }

  const sendShared = document.getElementById('sendShared');
  if(sendShared){
    sendShared.addEventListener('click', ()=>{
      const val = document.getElementById('sharedInput').value.trim();
      if(!val) return;
      state.shared.push({ sender: state.currentUser, text: val, ts: '刚刚' });
      render();
    });
  }

  const askAI = document.getElementById('askAI');
  if(askAI){
    askAI.addEventListener('click', handleAskAI);
  }

  document.querySelectorAll('[data-send-draft]').forEach(btn=>{
    btn.addEventListener('click', ()=> openConfirmModal(btn.getAttribute('data-send-draft')));
  });
}

function openConfirmModal(draftText){
  const root = document.getElementById('modalRoot');
  root.innerHTML = `
    <div class="confirm-mask" id="confirmMask">
      <div class="confirm-card">
        <h3>发送给${escapeHtml(NAMES[partnerOf(state.currentUser)])}前，再确认一下</h3>
        <p>这句话会出现在"共同沟通"窗口，${escapeHtml(NAMES[partnerOf(state.currentUser)])}会看到。你可以先改一改措辞。</p>
        <textarea id="confirmText">${escapeHtml(draftText)}</textarea>
        <div class="confirm-actions">
          <button class="btn ghost" id="cancelSend">取消</button>
          <button class="btn ${COLOR_CLASS[state.currentUser]}" id="confirmSend">确认发送</button>
        </div>
      </div>
    </div>
  `;
  document.getElementById('cancelSend').addEventListener('click', ()=> root.innerHTML = '');
  document.getElementById('confirmSend').addEventListener('click', ()=>{
    const finalText = document.getElementById('confirmText').value.trim();
    if(finalText){
      state.shared.push({ sender: state.currentUser, text: finalText, ts: '刚刚' });
    }
    root.innerHTML = '';
    render();
  });
}

async function handleAskAI(){
  const input = document.getElementById('aiInput');
  const val = input.value.trim();
  if(!val) return;
  const user = state.currentUser;
  const partner = partnerOf(user);
  state.aiThreads[user].push({ role: 'user', content: val });
  input.value = '';
  render();
  document.getElementById('aiThinking').style.display = 'block';

  const diaryMine = state.diary[user].map(e => '- ' + e.text).join('\n') || '（暂无日记）';
  const diaryPartner = state.diary[partner].map(e => '- ' + e.text).join('\n') || '（暂无日记）';
  const sharedLog = state.shared.map(m => `${NAMES[m.sender]}：${m.text}`).join('\n') || '（暂无共同对话）';

  const systemPrompt = `你是"之间"，一个帮伴侣/家人化解沟通矛盾的中立AI。你现在服务的用户是"${NAMES[user]}"。

【${NAMES[user]}的日记，仅用于理解ta本人】
${diaryMine}

【${NAMES[partner]}的日记，仅用于理解对方的性格与情绪风格，绝不能引用、转述或让用户能反推出其中任何具体内容】
${diaryPartner}

【双方已经说出口的共同沟通记录，可以在建议中直接引用】
${sharedLog}

任务：
1. 用中立、不评判谁对错的语气，帮${NAMES[user]}理解这场矛盾里双方情绪背后可能的原因。
2. 给出具体、可操作的建议，帮助ta更好地表达自己、理解对方。
3. 如果合适，起草一句${NAMES[user]}可以直接发给${NAMES[partner]}的话，语气要缓和、非指责性，放进 draft_message 字段；如果当前不适合起草具体的话，draft_message 留空字符串。
4. 只返回一个JSON对象，不要有任何其他文字、不要用markdown代码块包裹，格式严格为：
{"reply": "给用户看的建议文本", "draft_message": "可选，一句要发给对方的话，没有则为空字符串"}`;

  try{
    const history = state.aiThreads[user].map(m => ({ role: m.role, content: m.content }));
    const response = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-6',
        max_tokens: 1000,
        system: systemPrompt,
        messages: history
      })
    });
    const data = await response.json();
    const textBlock = (data.content || []).map(c => c.text || '').join('\n').trim();
    let parsed;
    try{
      const clean = textBlock.replace(/```json|```/g, '').trim();
      parsed = JSON.parse(clean);
    }catch(e){
      parsed = { reply: textBlock || '抱歉，我这边暂时没能生成回复，可以再试一次。', draft_message: '' };
    }
    state.aiThreads[user].push({ role: 'assistant', content: parsed.reply, draft: parsed.draft_message || null });
  }catch(err){
    state.aiThreads[user].push({ role: 'assistant', content: '连接AI时出了点问题，可以稍后再试一次。', draft: null });
  }
  document.getElementById('aiThinking').style.display = 'none';
  render();
}

document.getElementById('toggleA').addEventListener('click', ()=>{ state.currentUser='A'; render(); });
document.getElementById('toggleB').addEventListener('click', ()=>{ state.currentUser='B'; render(); });
document.querySelectorAll('nav.tabs button').forEach(b=>{
  b.addEventListener('click', ()=>{ state.activeTab = b.dataset.tab; render(); });
});

render();
</script>
</body>
</html>
